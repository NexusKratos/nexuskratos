<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="1280" height="420" viewBox="0 0 1280 420">
<title id="title">Nexus Kratos — Open source, amplified by AI</title>
<desc id="desc">A dark banner with a connected constellation of work nodes and the journey Install, Discover, Allocate, Build, Verify.</desc>
